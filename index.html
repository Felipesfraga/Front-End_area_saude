<!DOCTYPE html>
<html lang="pt-BR">

    <head>

     <meta charset="UTF-8">

     <meta name="viewport" content="width=device-width, initial-scale=1.0">

     <title>Consulta - Cadastro de Pacientes</title>

     <link rel="stylesheet" href="style.css">
    </head>

    <body>
        <div class="container">
          <h1>✚ Consulta</h1>

          <p>Sistema de Cadastro de Pacientes</p>

        

         

         <section class="painel">

          <p>Preencha os dados para cadastrar um paciente.</p>

          <form id="formPaciente">

            <label for="nome">Nome completo:</label>
            <input type="text" id="nome" required>

            <label for="endereco">Endereço:</label>
            <input type="text" id="endereco" required>

            <label for="telefone">Telefone: </label>
            <input type="tel" id="telefone" placeholder="(11) 99999-9999" required>

            <label for="email">E-mail:</label>
            <input type="email" id="email" required>

            <label for="nacionalidade">Nacionalidade:</label>
            <input type="nacionalidade" id="nacionalidade" required>

            <label for="naturalidade">Naturalidade (cidade/UF):</label>
            <input type="text" id="naturalidade" required>

            <label for="foto">Foto do paciente:</label>
            <input type="file" id="foto" accept="image/*">

            <div class="area-foto">

            <img id="previewFoto" src="" alt="Prévia da foto do paciente" class="foto">

            </div>

            <button type="submit">Salvar cadastro</button>

            <button type="button" onclick="Limparformulario()">LIMPAR</button>
          </form>
         </section>

         <section class="painel">

        
            <h2>Pacientes cadastrados</h2>
        
            <div id="listaPacientes">
        
                Nenhum paciente cadastrado.
        
            </div>
        
         </section>

        </div>
        
        <footer>
         <p>Consulta | Projeto educacional de HTML5, CSS3 e JavaScript</p>

         <script src="script.js"></script>

        </footer>

</html>
